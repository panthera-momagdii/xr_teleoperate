      /dev/video2 (iface :1.0) fourcc=UYVY, meanBGR=(151.3,151.3,151.3) -> IR/grey.
      /dev/video5 (iface :1.3) fourcc=YUYV, meanBGR=(26.4,32.7,8.5)     -> colour.
