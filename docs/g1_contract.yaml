# Panthera G1 hardware contract -- measured on PC2, 2026-08-28 (Part A, read-only).
#
# PREMISE CHANGE, 2026-08-28: the hands on this robot are NOT Dex5-1P.
# The shell reads INSPIRE-ROBOTS and the wrist ring reads RH56... -- Inspire RH56 hands.
# They do not speak Unitree's dex3 DDS protocol at all; they are driven from PC2 over
# Modbus TCP. That closes the 2026-08-24 "hands are silent" investigation as
# WRONG HAND MODEL, not as a fault. No Unitree ticket.
#
# Consequence: every DDS-hand field below is VOID -- not pending. They were questions
# about a part that is not fitted. They are kept, not deleted, per this file's own rule
# ("Do not delete a field once measured"), each with status: void and the reason.
#
# status: pending | measured | assumed | void
# Filename kept as-is so the diff is reviewable; it should be renamed once merged.

# =====================================================================
# THE HANDS -- as actually fitted
# =====================================================================
hand_model:
  status: measured
  value: "Inspire RH56"
  variant:
    status: measured
    value: "RH56E2-T1"
    measured_on: "2026-08-27, labels read directly at the wrist ring"
    labels:
      right: "RH56E2-2R-T1"
      left:  "RH56E2-2L-T1"
    vendor_marking: "www.inspire-robots.com"
    supersedes: >
      This block previously read status: pending with candidates
      ["RH56F-TP (Modbus TCP / Ethernet)", "RH56DFX / RH56DFQ (RS-485 / USB serial)"]
      and evidence_points_to: "RH56F-TP". The label reading resolves it and shows the
      guess was wrong in NAME: the part is an E2, which was not among the candidates.
      The Ethernet inference was right (E2 is Inspire's Ethernet generation, and the
      absent serial path independently rules out DFX/DFQ) -- but do not carry the
      "RH56F-TP" name forward anywhere. Whether E2 shares the FTP register map and
      bridge is the open question, tracked in docs/inspire_rh56e2.md.
  serial_numbers:
    right:
      status: measured
      value: "<local: hand_right_serial>"
    left:
      status: measured_partial
      value: "<local: hand_left_serial_partial>"
      confidence: >
        Read from Brandon's photo of the left wrist ring. Two characters (positions 12-13,
        shown as ??) are not legible in the image; they are most likely "01". Treat the
        full string as UNCONFIRMED until someone reads the ring directly -- it is an
        identity field, and a serial that is 90% right is not a serial.
      note: >
        The left and right prefixes differ in the third
        character. That is expected to be a per-unit serial, not a typo, but it is
        another reason not to infer the missing characters from the right hand's SN.
  power_led:
    status: measured
    value: "green on both hands"
  tactile:
    status: pending
    value: null
    hypothesis: "the T1 suffix is most likely Inspire's tactile option"
    blocked_on: >
      Confirm against Inspire's own RH56E2 material -- VERIFY, DO NOT ASSUME. Even if
      T1 is tactile, whether that data reaches the DDS state message is a separate
      question about the bridge, not about the hand.
  actuators_per_hand:
    status: measured
    value: 6
    source: "Inspire RH56 family specification"
  joints_per_hand:
    status: measured
    value: 12
    note: "12 joints driven by 6 actuators -- the extra DoF are mechanically coupled, not independently commandable."

hand_transport:
  status: measured
  value: "Modbus TCP over Ethernet, from PC2"
  hosts:
    status: measured                       # 2026-09-01, visit 2 gate V4
    left:  "<hand_left_ip>"
    right: "<hand_right_ip>"
    measured_how: >
      Ethernet unplug on the LEFT physical hand while the bridge was running. The bridge's
      Modbus error path names the failing IP directly, which is stronger evidence than a
      DDS-staleness inference.
    evidence_line: >
      "Connection to (<hand_left_ip>, 6000) failed: timed out" /
      "[19:32:38] <hand_left_ip>: 5791 reads, 9.1 Hz, 11 err   <hand_right_ip>: 5802 reads, 9.1 Hz, 0 err"
      -- <hand_left_ip> froze at 5791 reads and began erroring the instant the LEFT cable came out,
      while <hand_right_ip> continued at 0 errors. <hand_left_ip> was simultaneously unreachable by ping (3/3 lost).
    confirms: >
      The provisional mapping (<hand_left_ip> -> l, <hand_right_ip> -> r) was correct, and it is now measured
      rather than assumed. This also settles the upstream contradiction in favour of
      example/Headless_driver_double.py.
    upstream_bug: >
      inspire_hand_sdk/example/Headless_driver_l.py:11 is WRONG -- it maps
      <hand_right_ip> -> LR='l'. Anyone copying that example gets left and right swapped.
    methods_that_do_NOT_work:
      finger_flex: >
        IMPOSSIBLE, not merely unsuccessful. RH56 uses worm-gear actuators, which are
        non-backdrivable: a human cannot move a DOF to produce a readable angle delta.
        Measured peak |delta| <= 1 angle unit on all 12 DOF while a finger was pushed.
        docs/next_visit_pc2.md must not describe the flex method.
      palm_warming: >
        INCONCLUSIVE. The temperature register quantises to 2 C (every reading on both
        hands is even), and after ~90 min of polling the hands sit at ~40 C -- warmer than
        a ~34 C palm. A ~6 C differential in the wrong direction through the shell cannot
        clear one quantum. Both sides jittered +/-2 with no trend over 240 s.
  evidence:
    ping_left: "2/2 received, rtt avg 0.350 ms, dev eth0"
    ping_right: "2/2 received, rtt avg 0.248 ms, dev eth0"
    mac_left: "<local: hand_left_mac>"
    mac_right: "<local: hand_right_mac>"
    mac_note: >
      the MAC's last four bytes are the hand IP written in hex, and the de: prefix is
      locally administered -- an embedded Ethernet module deriving its MAC from its
      configured IP. There is therefore NO vendor OUI to identify these by.
  serial_path_absent:
    status: measured
    value: "none"
    evidence: >
      No /dev/ttyUSB*, no /dev/ttyACM*, /dev/serial/by-id does not exist, no FTDI /
      CP210x / CH340 / Prolific bridge in lsusb, no usbserial kernel modules loaded.
      Only the Tegra SoC's own UARTs (ttyTHS0/3/4) with nothing attached.
      This is what rules out the RS-485/USB DFX/DFQ variants.

hand_driver_software_on_pc2:
  status: measured
  value: "NONE INSTALLED"
  detail:
    pymodbus: "not installed (neither system python3.8 nor conda g1visit py3.10)"
    pyserial: "not installed"
    mbpoll_modpoll: "not installed"
    unitree_inspire_dds: "not present -- find / -iname '*inspire*' returns nothing"
    container_image: "none -- no image, and none of 30+ containers reference inspire/modbus/rh56/hand"
    rt_inspire_topics: "0 on PC1's topic list, and 0 anywhere in the SEDP trace from any host"
  consequence: >
    The hands are reachable on the network and nothing on this box can talk to them.
    This is the gap to close before Part B can include hands. It is a bounded software
    gap, not a hardware fault.
  not_done_deliberately: >
    No TCP connect to port 502, no Modbus register read, no service started --
    a register read is a session on the hand.

# =====================================================================
# VOID -- questions about a Dex5-1P that is not fitted
# =====================================================================
hand_topic_prefix:
  status: void
  observed_value: "rt/dex3"
  reason: >
    rt/dex3/{left,right}/state and rt/lf/dex3/{left,right}/state ARE declared by PC1
    participant g1_dex_protocol_v2.0, and all four produced 0 samples
    (30 s on rt/dex3/*, 20 s on rt/lf/dex3/* -- the lf pair probed for the first time
    on 2026-08-28). They are the stock dex3 service advertising for a Unitree hand that
    is not attached. Nothing will ever publish there with Inspire hands fitted.
  negative_result: >
    grep -icE 'dex5|dex1/|hand_sdk|inspire|brainco' over all 89 topics published by PC1
    returns 0. This firmware exposes the hands under no other name -- the silence was
    not a namespace mistake.

hand_motor_count:
  status: void
  reason: "No DDS hand stream exists. Superseded by hand_model.actuators_per_hand (6) and joints_per_hand (12)."
  previously_expected: 20

press_sensor_modules:
  status: void
  reason: "Dex5 PressSensorState_ does not apply. Superseded by hand_model.tactile (pending variant)."
  previously_expected: 12

passive_slot_behaviour:
  status: void
  reason: >
    The DDS slot 4k+3 / 4k+2 coupling question was about Dex5 joint indices.
    RH56 coupling is a different mechanism (12 joints from 6 actuators) and must be
    re-asked against the Modbus register map once a driver exists.

verified_gains:
  status: void
  reason: "Dex5 DDS kp/kd in N*m vs mNm. RH56 is commanded over Modbus registers; the unit story does not carry over."

hand_power_and_enumeration:
  status: void
  observed_2026_08_24: "topics declared, 0 samples in 600 s"
  observed_2026_08_28: "topics declared, 0 samples in 30 s (rt/dex3) and 20 s (rt/lf/dex3)"
  reason: "Explained: wrong hand model. The dex3 service has no hand to talk to."

state_rate_hz:
  status: void
  reason: "No DDS hand stream. An RH56 poll rate will be a Modbus polling decision, not a published topic rate."

motor_temperature_idle_c:
  status: void
  reason: "Dex5 MotorState_.temperature does not apply. RH56 exposes temperature over Modbus registers if at all."

# =====================================================================
# DOMAIN 0 -- measured 2026-08-28, our containers all stopped
# =====================================================================
domain0:
  participants_total:
    status: measured
    value: 25
    besides_our_tool: 24
  process_names:
    status: measured
    value: [LogStreamService, ai_odom_node, basic_service, battery_guard, dds_bridge,
            emergency_stop, g1_dex_protocol_v2.0, humanoid, motion_switcher_service,
            python, python3, robot_state_service, robot_type_api_server,
            unitreeWebRTCClientMaster, videohub_pc4, vui_service, xfkTon]
  writers_by_host:
    status: measured
    value: {"<pc1_lan_ip>": 89, "<pc2_lan_ip>": 2}
    note: >
      Both PC2 writers are the STOCK videohub_pc4 service (rt/api/videohub/response,
      rt/frontvideostream). Neither is a command topic. Zero command-topic writers
      from any host but PC1.

  RATE_CAVEAT:
    status: SUPERSEDED 2026-09-01
    was: >
      Every Hz was a FLOOR, because tools/domain0_census.py derived rate from its own
      dequeued sample count. rt/lowcmd (666.5) and rt/lowstate (660.4) agreeing to ~1%
      across independent streams was the tell.
    now: >
      Fixed on branch (commit ed7a36f, gate G14e). Rate is now 1 / p10(source_timestamp
      deltas) -- the publisher's own send times, independent of how fast the reader
      dequeues -- with median as a drop indicator and an explicit DROPPING flag when the
      reader falls behind. The numbers below are from the fixed estimator and are
      measurements, not floors.

  lowstate:
    status: measured                        # re-measured 2026-09-01 with the fixed estimator
    writers: 2
    per_writer:
      "...2ee8-42d5:203": {rate_hz: 1157.9, median_hz: 1003.4, seen_hz: 625.9, samples: 6493, dropping: true}
      "...2a38-50ec:203": {rate_hz: 0.0, samples: 0}
    TICKS_PER_SAMPLE:
      status: measured
      value: 0.960
      answers: >
        The 2026-08-24 question. LowState_.tick is a PER-PUBLISH counter, incrementing
        ~once per published sample -- not a millisecond clock. So the Aug-24 method
        (counting unique ticks) was measuring publish rate correctly, and its 999.6 Hz
        figure was right while the sample-count figure (660.4 Hz) was the artefact.
      note: >
        The census reports 600.8 ticks/s, but that is computed over the samples this
        reader actually saw while DROPPING; scaled by the true rate it is ~1110 ticks/s.
        The ratio 0.960 is the meaningful number, not the absolute ticks/s.
    true_rate_hz: 1157.9
    type: "unitree_hg::msg::dds_::LowState_"
  lowcmd:
    status: measured
    writers: 2
    per_writer:
      "...5e1a-3647:1403": {rate_hz: 1062.8, median_hz: 1000.5, seen_hz: 645.7, samples: 7112, dropping: true}
      "...fd8d-d86e:e03": {rate_hz: 0.0, samples: 0}
    remeasured_2026_09_01: "1062.8 Hz on the carrying writer, with the fixed estimator"
    split_note: >
      H3 answered: this is NOT a ~500/133 split. ONE writer carries the entire stream
      and the other is idle at 0.0 Hz. Same shape on rt/lowstate.
    source_verified: "both udp/<pc1_lan_ip> (PC1), from the SEDP trace"
    type: "unitree_hg::msg::dds_::LowCmd_"
  arm_sdk:
    status: measured
    writers: 1
    hz: 0.0
    note: "Declared-but-idle endpoint from PC1, present 2026-08-24 and again today. Not motion mode."
  type_agreement:
    status: measured
    value: "all writers agree on every watched topic; all unitree_hg"

# =====================================================================
# BRIDGE + HAND STATE -- measured 2026-09-01 (visit 2)
# =====================================================================
bridge:
  status: measured
  repo: "panthera-momagdii/inspire_hand_ws"
  branch: "panthera/pc2-headless"
  sha: "3804d41d4794ca895cd281d16bbba38a319a958d"
  install:
    method: "pip install ./inspire_hand_sdk --no-deps   (NON-editable)"
    why_no_deps: >
      The package pins cyclonedds==0.10.2 and PC2's unitree_sdk2py depends on cyclonedds
      too. Verified on PC2: cyclonedds was 0.10.2 before AND after the install.
    pymodbus: "3.6.9"
    headless_proof: "import PyQt5 -> ModuleNotFoundError; the Qt stack is not pulled in"
    env: "conda g1visit, Python 3.10.21"
  runner:
    path: "~/panthera/bridge_run.py + ~/panthera/bridge_config.yaml"
    workarounds:
      network_param_ignored: >
        ModbusDataHandler(network=...) is silently dropped (inverted branch,
        inspire_sdk.py:77-81). The runner calls ChannelFactoryInitialize(0, "eth0")
        itself, once, and passes initDDS=False to every handler.
      swallowed_dds_failure: >
        A DDS init failure inside __init__ returns before self.pub/state_pub/sub exist and
        surfaces later as AttributeError: no attribute 'pub'. The runner asserts all three
        attributes after construction so the real cause is named at startup.
  STARTUP_WRITE:
    status: measured
    finding: >
      ModbusDataHandler.__init__ performs one Modbus WRITE before any DDS endpoint exists:
      inspire_sdk.py:87  self.client.write_register(1004,1,self.device_id)  #reser error
      Register 1004 = CLEAR_ERROR, established in-repo: example/init_set_inspire_hand.py
      documents 1005 SAVE / 1006 RESET_PARA / 1009 GESTURE_FORCE_CLB and names the method
      that writes 1004 clean_error(). It is NOT a motion register (1486/1474/1498/1522).
    read_loop: "clean -- read() only does read_holding_registers plus DDS publishes"
    mitigation: >
      bridge_run.py --read-only-start suppresses just the 1004 write, making startup
      strictly read-only. Used for both starts on 2026-09-01.
    outcome: >
      err = 0 on all 12 DOF at both starts, so there was no latched error to clear. The
      read-only start cost nothing and let us OBSERVE that rather than clearing it blind.
  stability:
    status: measured
    session_1: "63,447 reads per hand in 6459 s (1 h 48 m) at 9.8 Hz, ZERO errors on both"
    retires: >
      The V0 ICMP packet-loss concern (both hands drop 4-6% of pings). It predicted nothing
      about Modbus TCP, exactly as the fork's README said it would not.
  cable_recovery:
    status: measured
    value: "pymodbus re-establishes the session by itself after a cable interruption"
    evidence: "errors froze at 54 and the read count resumed climbing; no bridge restart needed"
    note: "A cable interruption on one hand does not disturb the other hand."
  dds:
    topics_published: ["rt/inspire_hand/state/l", "rt/inspire_hand/state/r",
                       "rt/inspire_hand/touch/l", "rt/inspire_hand/touch/r"]
    topic_subscribed: ["rt/inspire_hand/ctrl/l", "rt/inspire_hand/ctrl/r"]
    ctrl_never_exercised_2026_09_01: true
    state_rate_hz: {left: 11.7, right: 12.3, note: "p10-of-source-timestamp estimator; bridge read loop runs ~9.6-9.8 Hz"}
    writer_ip: "<pc2_lan_ip> (PC2, our bridge) -- confirmed by the census"

hand_state_at_rest:
  status: measured
  captured: "2026-09-01, after a battery swap, hands unpowered then repowered"
  n_dof_per_hand: 6
  left_210:
    angle_act:   [1, 1, 0, 5, 19, 990]
    force_act:   [137, 124, 45, 1162, 249, -119]
    current:     [0, 0, 0, 0, 0, 0]
    err:         [0, 0, 0, 0, 0, 0]
    status:      [255, 255, 255, 255, 255, 255]
    temperature: [42, 40, 40, 40, 40, 34]
  right_211:
    angle_act:   [10, 27, 49, 44, 23, 987]
    force_act:   [104, 92, 76, 106, -45, 72]
    current:     [0, 0, 0, 0, 0, 0]
    err:         [0, 0, 0, 0, 0, 0]
    status:      [255, 255, 255, 255, 255, 255]
    temperature: [44, 42, 42, 42, 42, 36]
  POSTURE:
    status: measured
    value: "five of six DOF fully bent, DOF5 (thumb rotation) open at ~990"
    confirmed_by_eye: true
    semantics: "1000 = fully open, 0 = fully bent"
    survives_power_cycle: true
    what_that_proves: >
      angle_act was unchanged across a full power-down. The hands hold position
      MECHANICALLY (worm-gear actuators are non-backdrivable), not electrically. That
      makes current = 0 a correct reading rather than a misread register.
    consequence_for_part_B: >
      The first ctrl message will drive the fingers OUT of a fully curled pose, not from
      an open one. Size the first commanded motion accordingly.
  REGISTER_MAP_CROSS_CHECK:
    status: measured
    finding: >
      angle_act and pos_act are cleanly ANTI-CORRELATED on all 12 DOF: where angle ~0
      (bent) pos ~1850-1930; on DOF5 where angle ~990 (open) pos ~42. Two independent
      encodings of the same joint moving in opposite senses, consistent across both hands.
      A misaligned register map would not produce that.
    bears_on: >
      The RH56DFTP register map reads correctly on these RH56E2 hands. This is the first
      DIRECT evidence for the E2 == DFTP equivalence, which until now was only
      distributor-asserted (see docs/inspire_rh56e2.md and README_PANTHERA.md).
    caveat: "Read path only. Nothing was written, so the write half of the map is unverified."
  unexplained:
    status_field_255: >
      status reads 255 (0xFF) on all 12 DOF, constant, on both hands, at every sample.
      Not an error (err = 0). Not interpreted. Recorded, not chased.
    force_dof3_left: >
      Left force_act DOF3 read 429 before the battery swap and 1159-1162 after, with no
      load applied and err = 0. A large single-channel shift in an at-rest baseline.
      Matters only if Part B uses force control.

