# ready pose for xr_teleoperate, G1_29 arms.
#
# DERIVED, not measured. tools/make_ready_pose.py solved the IK for wrist
#   targets x=0.28, y=+-0.1, z=0.18 (metres, IK base frame),
#   wrist pointing forward, palms inboard. Those targets sit inside the
#   measured reachable band (logs/overnight/reach_map.npz: at x=0.30 both arms
#   reach z=+0.05..+0.55).
#
# A POSE CAPTURED FROM THE ROBOT BEATS THIS ONE. Put the arms where you want
#   them and run:  python tools/capture_pose.py --out poses/tray.yaml
#
# Checked: worst IK position error 0.000 mm, worst rotation error
#   0.00000 rad; every joint inside its URDF limits with at least
#   0.7477 rad to spare; hands 20.0 cm apart;
#   anatomical elbow bend 92/92 degrees.
#
# NOTE: the elbow JOINT ANGLE is not the anatomical bend on this URDF. At q=0
#   the elbow joint reads 0 while the arm is already bent ~90 degrees.
#
# Rendered: logs/overnight/ready_pose.png

name: ready
robot: G1_29
units: radians
# Order is G1_29_JointArmIndex (robot_arm.py:285-302), motors 15..28, but the
# names are what is read -- a reordered list cannot silently mean something else.
joints:
  left_shoulder_pitch_joint:  -0.260572
  left_shoulder_roll_joint:   -0.105954
  left_shoulder_yaw_joint:    -0.092373
  left_elbow_joint:           -0.299481
  left_wrist_roll_joint:      +0.082860
  left_wrist_pitch_joint:     +0.556612
  left_wrist_yaw_joint:       +0.143409
  right_shoulder_pitch_joint: -0.260568
  right_shoulder_roll_joint:  +0.105926
  right_shoulder_yaw_joint:   +0.092345
  right_elbow_joint:          -0.299495
  right_wrist_roll_joint:     -0.082838
  right_wrist_pitch_joint:    +0.556617
  right_wrist_yaw_joint:      -0.143385
